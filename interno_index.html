<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>Savian Apps</title>
<meta name="description" content="Acceso rápido a las herramientas internas de Savian" />

<!-- PWA manifest -->
<link rel="manifest" href="interno_manifest.json" />
<meta name="theme-color" content="#0fa3a4" />
<link rel="icon" href="interno_icons/interno_favicon.png" sizes="64x64" type="image/png" />
<link rel="icon" href="interno_icons/interno_favicon-32.png" sizes="32x32" type="image/png" />

<!-- Android / Chrome / escritorio -->
<meta name="mobile-web-app-capable" content="yes" />

<!-- iOS "Añadir a pantalla de inicio" -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Savian Apps" />
<link rel="apple-touch-icon" href="interno_icons/interno_apple-touch-icon.png" />

<style>
  :root{
    --teal: #0fa3a4;
    --teal-dark: #0b7f80;
    --cyan: #14c7ee;
    --bg: #f4f7f8;
    --card: #ffffff;
    --text: #10262a;
    --muted: #5b7278;
    --border: rgba(15,163,164,0.14);
    --shadow: 0 10px 30px rgba(11,60,62,0.10);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg: #0c1416;
      --card: #10201f;
      --text: #eef7f6;
      --muted: #9db3b3;
      --border: rgba(20,199,238,0.18);
      --shadow: 0 10px 30px rgba(0,0,0,0.45);
    }
  }
  *{ box-sizing: border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding-bottom: calc(24px + env(safe-area-inset-bottom));
  }
  header{
    padding: calc(28px + env(safe-area-inset-top)) 20px 22px;
    background: linear-gradient(160deg, var(--teal) 0%, var(--teal-dark) 60%, #0a6a6b 100%);
    color: #fff;
    border-radius: 0 0 28px 28px;
    box-shadow: var(--shadow);
  }
  .brand{ display:flex; align-items:center; gap:12px; }
  .brand img{ width:44px; height:44px; border-radius:12px; background:#fff; padding:5px; }
  .brand h1{ margin:0; font-size: 22px; letter-spacing: 0.2px; }
  header p{ margin: 10px 0 0; font-size: 14px; color: rgba(255,255,255,0.85); max-width: 46ch; }

  main{ max-width: 720px; margin: 0 auto; padding: 20px 16px 8px; }

  .grid{ display:grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
  @media (max-width: 420px){ .grid{ grid-template-columns: 1fr; } }

  .card{
    display:flex; flex-direction:column; gap: 10px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 18px;
    box-shadow: var(--shadow);
  }
  .card-top{ display:flex; align-items:center; gap:12px; }
  .icon-wrap{
    width:52px; height:52px; border-radius: 16px; overflow:hidden;
    background:#fff; display:flex; align-items:center; justify-content:center;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08); flex-shrink:0;
  }
  .icon-wrap img{ width:100%; height:100%; object-fit:cover; }
  .card h2{ margin:0; font-size: 16px; }
  .card p{ margin: 2px 0 0; font-size: 12.5px; color: var(--muted); line-height:1.35; }

  .card-actions{ display:flex; gap:8px; margin-top:4px; }
  .btn{
    flex:1;
    display:flex; align-items:center; justify-content:center; gap:6px;
    text-decoration:none;
    font-size: 12.5px; font-weight:700;
    padding: 10px 10px;
    border-radius: 12px;
    -webkit-tap-highlight-color: transparent;
    border: none;
  }
  .btn:active{ transform: scale(0.97); }
  .btn-open{ background: var(--teal); color:#fff; }
  .btn-download{ background: transparent; color: var(--teal-dark); border: 1px solid var(--border); }
  @media (prefers-color-scheme: dark){ .btn-download{ color: var(--cyan); } }

  #install-banner{
    max-width: 720px; margin: 4px auto 0; padding: 14px 16px;
    background: var(--card); border: 1px solid var(--border); border-radius: 16px;
    box-shadow: var(--shadow); display:flex; align-items:center; gap: 12px;
  }
  #install-banner.hidden{ display:none; }
  #install-banner p{ margin:0; font-size: 13px; color: var(--muted); flex:1; line-height:1.4; }
  #install-banner strong{ color: var(--text); }
  #install-btn{ background: var(--teal); color:#fff; border:none; border-radius: 12px; padding: 10px 14px; font-size: 13px; font-weight:600; white-space:nowrap; }
  #install-close{ background: transparent; border: none; color: var(--muted); font-size: 18px; line-height:1; padding: 4px; }

  footer{ text-align:center; color: var(--muted); font-size: 11.5px; padding: 26px 16px 6px; }
</style>
</head>
<body>

<header>
  <div class="brand">
    <img src="interno_assets/interno_portal-card.png" alt="" />
    <h1>Savian Apps</h1>
  </div>
  <p>Todas tus herramientas de trabajo en un solo sitio. "Abrir" la usa al momento; "Descargar" crea su icono propio en tu pantalla de inicio.</p>
</header>

<main>
  <div id="install-banner" class="hidden">
    <p id="install-text"><strong>Instala Savian Apps</strong><br/>Añádela a tu pantalla de inicio para abrirla como una app.</p>
    <button id="install-btn" type="button">Instalar</button>
    <button id="install-close" type="button" aria-label="Cerrar">✕</button>
  </div>

  <section class="grid" id="apps-grid" aria-label="Aplicaciones Savian">
    <!-- Las tarjetas se generan solas desde interno_apps.json, ver <script> más abajo -->
  </section>

  <footer>Savian Apps</footer>
</main>

<script>
  /* ════════════════════════════════════════════════════════════════
     CÓMO AÑADIR UNA NUEVA APP AL HUB (por ejemplo, una que
     desarrollemos más adelante):

     1) Abre "interno_apps.json" y añade un bloque nuevo al array
        "apps" con: id, name, shortName, description, url,
        themeColor, cardIcon e installPath. Con eso YA aparece la
        tarjeta aquí abajo, sin tocar este archivo.

     2) Para que el botón "Descargar" de esa tarjeta funcione (icono
        propio en el escritorio/pantalla de inicio), copia la carpeta
        "interno_apps/interno_template/" completa, renómbrala (por
        ejemplo "interno_apps/interno_miappnueva/"), y dentro:
          - cambia la URL en interno_index.html (constante APP_URL)
          - cambia nombre/colores en interno_manifest.json
          - sustituye los iconos interno_icon-*.png por el logo de la
            nueva app (puedes usar interno_scripts/interno_generar_iconos.py
            para generarlos automáticamente a partir de un logo).
        Esa carpeta ya trae los comentarios explicando cada paso.

     Todo lo demás (tarjetas, botón "Abrir", banner de instalación del
     hub) es automático.
     ════════════════════════════════════════════════════════════════ */

  const grid = document.getElementById("apps-grid");

  fetch("interno_apps.json")
    .then((r) => r.json())
    .then((data) => {
      data.apps.forEach((app) => {
        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
          <div class="card-top">
            <div class="icon-wrap"><img src="${app.cardIcon}" alt="" /></div>
            <div>
              <h2>${app.name}</h2>
            </div>
          </div>
          <p>${app.description}</p>
          <div class="card-actions">
            <a class="btn btn-open" href="${app.url}">Abrir</a>
            <a class="btn btn-download" href="${app.installPath}">⬇ Descargar</a>
          </div>
        `;
        grid.appendChild(card);
      });
    })
    .catch((err) => {
      grid.innerHTML = '<p style="color:var(--muted)">No se han podido cargar las apps (interno_apps.json).</p>';
      console.error(err);
    });

  // ---- Service worker (instalabilidad en Android/Chrome/escritorio + shell offline) ----
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("interno_sw.js").catch(() => {});
    });
  }

  // ---- Detecta si ya se está ejecutando instalada (standalone) ----
  function isStandalone(){
    return window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;
  }

  const ua = window.navigator.userAgent;
  const isIOS = /iphone|ipad|ipod/i.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  const isAndroid = /android/i.test(ua);

  const banner = document.getElementById("install-banner");
  const text = document.getElementById("install-text");
  const btn = document.getElementById("install-btn");
  const closeBtn = document.getElementById("install-close");

  let deferredPrompt = null;

  window.addEventListener("beforeinstallprompt", (e) => {
    e.preventDefault();
    deferredPrompt = e;
    if (!isStandalone()) showBanner();
  });

  function showBanner(){
    if (sessionStorage.getItem("savian-install-dismissed")) return;
    banner.classList.remove("hidden");
  }

  if (!isStandalone()){
    if (isIOS){
      text.innerHTML = "<strong>Instala Savian Apps</strong><br/>Toca compartir <span aria-hidden='true'>⬆️</span> y luego “Añadir a pantalla de inicio”.";
      btn.style.display = "none";
      showBanner();
    } else if (isAndroid){
      setTimeout(() => {
        if (!deferredPrompt && !isStandalone()){
          text.innerHTML = "<strong>Instala Savian Apps</strong><br/>Abre el menú ⋮ de Chrome y toca “Instalar aplicación”.";
          btn.style.display = "none";
          showBanner();
        }
      }, 2500);
    }
  }

  btn.addEventListener("click", async () => {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    await deferredPrompt.userChoice;
    deferredPrompt = null;
    banner.classList.add("hidden");
  });

  closeBtn.addEventListener("click", () => {
    banner.classList.add("hidden");
    sessionStorage.setItem("savian-install-dismissed", "1");
  });
</script>
</body>
</html>
